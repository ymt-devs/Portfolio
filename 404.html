<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Page Not Found (404) — Yojan Man Tuladhar</title>
  <link href="assets/img/favicon.svg" rel="icon" type="image/svg+xml">
  <link href="assets/img/favicon.png?v=2" rel="alternate icon" type="image/png">
  <link href="assets/img/apple-touch-icon.png?v=2" rel="apple-touch-icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    body {
      background-color: #040404;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 50px 30px;
      max-width: 550px;
      width: 100%;
      backdrop-filter: blur(10px);
    }
    .error-code {
      font-size: 80px;
      font-weight: 800;
      color: #18d26e;
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 15px;
    }
    .error-desc {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .btn-return {
      background: #18d26e;
      color: #000;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 30px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-return:hover {
      background: #35e888;
      color: #000;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-desc">The requested page does not exist or has been moved. You can return to the main portfolio.</p>
    <a href="index.html" class="btn-return"><i class="bi bi-house-door-fill"></i> Return to Portfolio</a>
  </div>
</body>

</html>
