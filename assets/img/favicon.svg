<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1812"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#bg)" stroke="#18d26e" stroke-width="5" />
  <!-- Glow & Text -->
  <g filter="url(#glow)">
    <text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="38" font-weight="800" fill="#18d26e" text-anchor="middle" letter-spacing="1.5">YMT</text>
    <rect x="42" y="85" width="44" height="4.5" rx="2.25" fill="#35e888" />
  </g>
</svg>
